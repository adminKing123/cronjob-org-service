<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cron Service Admin{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --admin-header: #334155;
      --admin-header-dark: #1e293b;
      --admin-brand: #fde68a;
      --admin-breadcrumb-bg: #cbd5e1;
      --admin-breadcrumb-text: #1e293b;
      --admin-module-bar: #475569;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --border: #cbd5e1;
      --border-strong: #94a3b8;
      --text: #0f172a;
      --text-secondary: #334155;
      --muted: #64748b;
      --link: #2563eb;
      --link-hover: #1e40af;
      --success: #059669;
      --success-bg: #ecfdf5;
      --error: #dc2626;
      --error-bg: #fef2f2;
      --row-alt: #f9fafb;
      --row-hover: #fef9c3;
      --radius: 8px;
      --radius-lg: 12px;
      --font: "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --mono: ui-monospace, Consolas, monospace;
      --header-h: 56px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { color: var(--link-hover); text-decoration: underline; }

    /* —— Site header (Django-style bar) —— */
    #header {
      background: var(--admin-header);
      color: #fff;
      padding: 0 1.25rem;
      height: var(--header-h);
      min-height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .header-main {
      display: flex;
      align-items: center;
      flex: 1;
      min-width: 0;
      height: 100%;
    }
    #branding {
      display: flex;
      align-items: center;
      align-self: stretch;
      height: 100%;
    }
    #branding a {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      height: 100%;
      color: var(--admin-brand);
      font-weight: 400;
      font-size: 1.15rem;
      line-height: 1;
      text-decoration: none;
      padding-right: 1.25rem;
      border-right: 1px solid rgba(255, 255, 255, 0.2);
      margin-right: 0.25rem;
      white-space: nowrap;
    }
    #branding a:hover { color: #fff; text-decoration: none; }
    #branding .bi {
      font-size: 1.25rem;
      color: #fff;
      line-height: 1;
      vertical-align: middle;
    }

    /* Nav links — not tabs */
    #nav-global {
      display: flex;
      align-items: center;
      align-self: stretch;
      height: 100%;
      gap: 0;
    }
    #nav-global a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      height: 100%;
      padding: 0 1rem;
      color: #e2e8f0;
      font-weight: 500;
      font-size: 0.9rem;
      line-height: 1;
      text-decoration: none;
      box-shadow: inset 0 -2px 0 transparent;
    }
    #nav-global a:hover { color: #fff; text-decoration: none; }
    #nav-global a.active {
      color: #fff;
      font-weight: 600;
      box-shadow: inset 0 -2px 0 var(--admin-brand);
    }

    #user-tools {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    #user-tools .link-btn {
      color: #e2e8f0;
      background: none;
      border: none;
      cursor: pointer;
      font: inherit;
      font-weight: 500;
      font-size: 0.88rem;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 0.5rem;
    }
    #user-tools .link-btn:hover { color: #fff; text-decoration: underline; }

    .breadcrumbs {
      background: var(--admin-breadcrumb-bg);
      padding: 0.55rem 1.25rem;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--border-strong);
      color: var(--admin-breadcrumb-text);
    }
    .breadcrumbs a {
      color: var(--admin-breadcrumb-text);
      font-weight: 600;
    }
    .breadcrumbs a:hover { color: var(--admin-header-dark); }
    .breadcrumbs .sep { margin: 0 0.4rem; color: var(--border-strong); }

    #content {
      padding: 1.5rem;
      max-width: 1320px;
      margin: 0 auto;
    }
    #content h1 {
      margin: 0 0 0.35rem;
      font-size: 1.35rem;
      font-weight: 400;
      color: var(--text);
    }
    #content .subtitle {
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .module {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: 1.25rem;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    .module h2, .module caption {
      margin: 0;
      padding: 8px 12px;
      font-weight: 400;
      font-size: 0.78rem;
      text-align: left;
      background: var(--admin-module-bar);
      color: #fff;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .module .module-inner { padding: 1rem 1.15rem; }

    @media (max-width: 768px) {
      #nav-global { display: none; }
    }

    .changelist-module {
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      background: var(--surface);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }
    .module-caption {
      margin: 0;
      padding: 8px 12px;
      font-weight: 400;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: var(--admin-module-bar);
      color: #fff;
    }

    #toolbar {
      padding: 8px 12px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
    }
    #toolbar form.search-form {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 6px 8px;
    }
    .fc-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .fc-item label,
    .fc-item .fc-label {
      font-size: 0.65rem;
      font-weight: 700;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
    }
    #toolbar input[type=text],
    #toolbar input[type=date],
    #toolbar select {
      height: 28px;
      padding: 0 8px;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      font: inherit;
      font-size: 0.82rem;
      background: var(--surface);
      min-width: 0;
    }
    .fc-status select { width: 112px; min-width: 112px; }
    .fc-sort select { width: 148px; }
    .fc-text input { width: 112px; }
    .fc-date input { width: 128px; }
    @media (max-width: 900px) {
      .fc-text input, .fc-date input, .fc-sort select { width: 100%; min-width: 100px; }
      .fc-item { flex: 1 1 100px; }
    }
    #toolbar input:focus,
    #toolbar select:focus {
      outline: none;
      border-color: var(--primary);
    }
    .fc-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 28px;
      margin-left: 2px;
    }
    #toolbar .search-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      height: 28px;
      padding: 0 12px;
      border-radius: 4px;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      font-size: 0.8rem;
      white-space: nowrap;
    }
    #toolbar .search-btn:hover { background: var(--primary-hover); }
    #toolbar .reset-link {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
    }
    #toolbar .reset-link:hover { color: var(--error); }

    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    table#result_list {
      width: 100%;
      border-collapse: collapse;
      border: none;
      background: var(--surface);
    }
    table#result_list.cron-logs-table {
      table-layout: fixed;
      min-width: 920px;
    }
    table#result_list.schedules-table {
      table-layout: auto;
      min-width: 1080px;
    }
    #result_list thead th {
      padding: 0.65rem 0.85rem;
      background: var(--row-alt);
      border-bottom: 1px solid var(--border);
      font-size: 0.7rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    #result_list thead th a {
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }
    #result_list thead th a:hover { color: var(--primary); text-decoration: none; }
    #result_list thead th.sorted { background: var(--primary-soft); }
    #result_list tbody tr:nth-child(even) { background: var(--row-alt); }
    #result_list tbody td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      font-size: 0.86rem;
      line-height: 1.45;
    }
    #result_list tbody tr:hover td { background: var(--row-hover); }
    #result_list .col-id { width: 56px; white-space: nowrap; }
    #result_list .col-time { width: 108px; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--text-secondary); }
    #result_list .col-workflow { width: 22%; min-width: 140px; }
    #result_list .col-owner { width: 18%; min-width: 120px; }
    #result_list .col-mode { width: 72px; white-space: nowrap; }
    #result_list .col-duration { width: 80px; white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
    #result_list .col-status { width: 96px; white-space: nowrap; }
    #result_list .col-action { width: 52px; white-space: nowrap; text-align: right; }
    #result_list.schedules-table .col-wf-name { min-width: 120px; max-width: 200px; }
    #result_list.schedules-table .col-wf-id { min-width: 140px; max-width: 220px; }
    #result_list.schedules-table .col-owner { min-width: 140px; max-width: 200px; }
    #result_list.schedules-table .col-cron { white-space: nowrap; }
    #result_list.schedules-table .col-tz { width: 64px; white-space: nowrap; }
    #result_list.schedules-table .col-cjo-id { width: 88px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    #result_list.schedules-table .col-url { min-width: 200px; max-width: 320px; }
    .cell-clip {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cell-subject {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
    }

    .status-dot {
      display: inline-block;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      vertical-align: middle;
      box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.08);
    }
    .status-dot.sent,
    .status-dot.success { background: var(--success); }
    .status-dot.failed { background: var(--error); }
    .status-dot.pending { background: #d97706; }
    .status-dot.dispatched { background: var(--primary); }

    .status-pill {
      display: inline-block;
      max-width: 100%;
      padding: 0.12rem 0.45rem;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
    }
    .status-pill.success { background: var(--success-bg); color: var(--success); }
    .status-pill.failed { background: var(--error-bg); color: var(--error); }
    .status-pill.pending { background: #fffbeb; color: #b45309; border: 1px solid #fcd34d; }
    .status-pill.dispatched { background: var(--primary-soft); color: var(--primary); border: 1px solid #bfdbfe; }

    .mode-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
    }
    .mode-badge.proxy { color: var(--primary); }

    .cell-code {
      display: block;
      font-family: var(--mono);
      font-size: 0.78rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: transparent;
      border: none;
      padding: 0;
    }
    .cell-link {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.82rem;
    }

    .table-empty {
      text-align: center;
      padding: 2rem 1rem !important;
      color: var(--muted);
    }
    .table-empty .bi {
      font-size: 1.5rem;
      display: block;
      margin-bottom: 8px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .status-badge.sent,
    .status-badge.success { background: var(--success-bg); color: var(--success); }
    .status-badge.failed { background: var(--error-bg); color: var(--error); }
    .status-badge.pending { background: #fffbeb; color: #b45309; }
    .status-badge.dispatched { background: var(--primary-soft); color: var(--primary); }

    .paginator {
      padding: 10px 12px;
      background: #f8fafc;
      border-top: 1px solid var(--border);
      font-size: 0.88rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.65rem;
    }
    .paginator a, .paginator span.this-page {
      padding: 0.25rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--link);
    }
    .paginator span.this-page {
      font-weight: 700;
      background: var(--admin-module-bar);
      color: #fff;
      border-color: var(--admin-module-bar);
    }
    .paginator a:hover { background: var(--primary-soft); text-decoration: none; }
    .paginator .disabled { opacity: 0.45; pointer-events: none; }

    .object-tools {
      float: right;
      margin: 0 0 0.75rem;
      list-style: none;
      padding: 0;
    }
    .object-tools li { display: inline-block; margin-left: 0.5rem; }
    .button, input[type=submit].default, button.default {
      background: var(--primary);
      color: #fff;
      padding: 0.5rem 1rem;
      border-radius: var(--radius);
      border: none;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      text-decoration: none;
    }
    .button:hover, button.default:hover {
      background: var(--primary-hover);
      color: #fff;
      text-decoration: none;
    }
    .button-secondary {
      background: var(--surface);
      color: var(--text-secondary);
      border: 1px solid var(--border-strong);
    }
    .button-secondary:hover { background: var(--row-alt); color: var(--text); }

    .messagelist { list-style: none; padding: 0; margin: 0 0 1rem; }
    .messagelist li { padding: 0.75rem 1rem; border-radius: var(--radius); margin-bottom: 0.5rem; }
    .messagelist .success { background: var(--success-bg); border: 1px solid #a7f3d0; color: #065f46; }
    .messagelist .error { background: var(--error-bg); border: 1px solid #fecaca; color: #991b1b; }

    .form-row { margin-bottom: 1rem; }
    .form-row label { display: block; font-weight: 600; margin-bottom: 0.35rem; font-size: 0.85rem; color: var(--text-secondary); }
    .form-row .help { font-size: 0.82rem; color: var(--muted); margin-top: 0.25rem; }
    .form-row input[type=text],
    .form-row input[type=email],
    .form-row input[type=password],
    .form-row input[type=number],
    .form-row input[type=file],
    .form-row textarea,
    .form-row select {
      width: 100%;
      max-width: 520px;
      padding: 0.5rem 0.65rem;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      font: inherit;
      background: var(--surface);
    }
    .form-row textarea { min-height: 120px; }

    dl.detail-grid {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 0.5rem 1rem;
      margin: 0;
    }
    dl.detail-grid dt { font-weight: 600; color: var(--muted); font-size: 0.85rem; }
    dl.detail-grid dd { margin: 0; }

    pre.body-block {
      background: var(--row-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      overflow: auto;
      max-height: 400px;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    code {
      font-family: var(--mono);
      font-size: 0.88em;
      background: var(--row-alt);
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .key-row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; margin-top: 0.5rem; }
    .key-display {
      font-family: var(--mono);
      background: var(--row-alt);
      border: 1px solid var(--border);
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius);
      flex: 1;
      min-width: 200px;
      font-size: 0.85rem;
    }
    .result-box {
      margin-top: 1rem;
      padding: 1rem;
      font-family: var(--mono);
      font-size: 0.82rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--row-alt);
      white-space: pre-wrap;
    }
    .result-box.ok { border-color: #a7f3d0; background: var(--success-bg); }
    .result-box.err { border-color: #fecaca; background: var(--error-bg); }

    body.login #container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(165deg, var(--primary-soft) 0%, var(--bg) 50%);
      padding: 1.5rem;
    }
    body.login #content { max-width: 400px; width: 100%; padding: 0; }
    body.login .login-form {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2rem;
      border-radius: var(--radius-lg);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }
    body.login #branding-center { text-align: center; margin-bottom: 1.25rem; }
    body.login #branding-center .bi { font-size: 2.25rem; color: var(--primary); }
    body.login h1 { text-align: center; font-size: 1.2rem; font-weight: 700; margin: 0.5rem 0 0; }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    @media (max-width: 640px) { .stat-row { grid-template-columns: 1fr; } }
    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.85rem 1rem;
      border-radius: var(--radius-lg);
    }
    .stat-box .label { font-size: 0.72rem; text-transform: uppercase; color: var(--muted); font-weight: 700; }
    .stat-box .value { font-size: 1.45rem; font-weight: 700; margin-top: 0.2rem; }
    .text-success { color: var(--success); }
    .text-error { color: var(--error); }
    .clearfix::after { content: ""; display: table; clear: both; }

    /* API docs (public + readable) */
    .doc-page { max-width: 820px; }
    .doc-page h2 {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 1.5rem 0 0.5rem;
      color: var(--text);
    }
    .doc-page h2:first-child { margin-top: 0; }
    .doc-page p, .doc-page li { color: var(--text-secondary); font-size: 0.92rem; }
    .doc-page ul { padding-left: 1.25rem; }
    .doc-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      margin: 0.5rem 0 1rem;
    }
    .doc-table th, .doc-table td {
      border: 1px solid var(--border);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
    }
    .doc-table th { background: var(--row-alt); font-weight: 600; }
    pre.doc-pre {
      background: #1e293b;
      color: #e2e8f0;
      padding: 12px 14px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 0.78rem;
      line-height: 1.5;
      margin: 0.5rem 0 1rem;
    }
    .doc-callout {
      background: var(--primary-soft);
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 0.88rem;
      margin: 0.75rem 0;
    }
    #header.docs-open-header .docs-open-link {
      color: #fde68a;
      font-weight: 600;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block layout %}{% endblock %}
</body>
</html>
